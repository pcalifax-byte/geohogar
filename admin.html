<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d9488"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/favicon.png"><script>if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:"class"}</script><script src="js/config.js"></script><script src="js/auth.js"></script><script>Auth.theme()</script><title>Administración · MapMarket</title><meta name="robots" content="noindex,nofollow"></head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
<header class="bg-white dark:bg-slate-800 border-b dark:border-slate-700"><div class="max-w-5xl mx-auto flex items-center gap-3 px-4 py-2"><a href="index.html" class="font-bold text-teal-700 dark:text-teal-400 py-2">📍 MapMarket</a><span class="text-sm opacity-70">🛠️ Administración</span><a href="mensajes.html" class="ml-auto text-sm py-3 px-2">💬 Bandeja soporte</a></div></header>
<main class="max-w-5xl mx-auto p-4"><h1 class="text-2xl font-extrabold">Panel de administración</h1>
<nav id="tabs" class="flex gap-2 mt-3 overflow-x-auto" role="tablist"></nav><div id="out" class="mt-4" aria-live="polite">Cargando…</div></main>
<script>
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let C;
const fecha=t=>new Date(t).toLocaleString('es-CR',{dateStyle:'short',timeStyle:'short'});
const btn=(t,a,cls='border dark:border-slate-600')=>`<button data-a="${a}" class="${cls} rounded-lg px-3 text-sm" style="min-height:40px">${t}</button>`;
const T={
 moderacion:['🏠 Moderación',async()=>{const {data,error}=await C.from('anuncios').select('*').eq('estado','pendiente').order('created_at');if(error)throw error;
  return data.length?data.map(a=>`<article class="bg-white dark:bg-slate-800 rounded-xl shadow p-4 mb-3" data-id="${a.id}"><div class="flex gap-3"><div class="flex gap-1 overflow-x-auto max-w-[45%]">${(a.imagenes||[]).map(u=>`<a href="${E(u)}" target="_blank" rel="noopener"><img src="${E(u)}" alt="Foto del anuncio" class="h-24 rounded"></a>`).join('')||'<div class="h-24 w-24 bg-slate-200 dark:bg-slate-700 rounded flex items-center justify-center text-xs">Sin fotos</div>'}</div>
   <div class="flex-1 min-w-0"><b>${E(a.titulo)}</b><div class="text-sm">${E(a.tipo)} · ${E(a.zona||'')} ${E(a.provincia)} · <b>${a.moneda==='CRC'?'₡':'$'}${Number(a.precio).toLocaleString('es-CR')}</b> · ${a.habitaciones??'–'} hab · ${a.banos??'–'} baños · ${a.area??'–'} m²</div><p class="text-xs opacity-80 mt-1 whitespace-pre-wrap">${E(a.descripcion||'')}</p><p class="text-[11px] opacity-60 mt-1">${fecha(a.created_at)} · <a class="underline" target="_blank" href="https://www.openstreetmap.org/?mlat=${a.lat}&mlon=${a.lon}#map=16/${a.lat}/${a.lon}">ver ubicación</a></p></div></div>
   <div class="flex flex-wrap gap-2 mt-2">${btn('✅ Aprobar','ok','bg-teal-600 text-white')}<input data-r placeholder="Motivo de rechazo" maxlength="300" class="flex-1 min-w-[160px] px-2 rounded-lg border dark:bg-slate-700 dark:border-slate-600" aria-label="Motivo de rechazo">${btn('❌ Rechazar','no')}</div></article>`).join(''):'<p class="opacity-70">No hay anuncios pendientes 🎉</p>'},
  async(el,a,card)=>{const id=card.dataset.id,m=card.querySelector('[data-r]').value.trim();if(a==='no'&&!m)return alert('Indica el motivo');const {error}=await C.from('anuncios').update(a==='ok'?{estado:'aprobado'}:{estado:'rechazado',motivo_rechazo:m}).eq('id',id);if(error)throw error;card.remove()}],
 reportes:['🚩 Reportes',async()=>{const [r,u]=await Promise.all([C.from('reportes').select('*').neq('estado','resuelto').order('created_at',{ascending:false}).limit(200),C.from('reportes_usuarios').select('*').order('created_at',{ascending:false}).limit(100)]);if(r.error)throw r.error;
  return '<h2 class="font-bold">Anuncios reportados</h2>'+(r.data.length?'<div class="overflow-x-auto"><table class="w-full text-sm mt-2"><tr class="text-left opacity-60"><th>Fecha</th><th>Anuncio</th><th>Motivo</th><th>Detalle</th><th></th></tr>'+r.data.map(x=>`<tr class="border-t dark:border-slate-700" data-id="${x.id}"><td class="py-1 pr-2 whitespace-nowrap">${fecha(x.created_at)}</td><td><a class="underline" target="_blank" href="index.html?p=${encodeURIComponent(x.property_id)}">${E(x.property_id)}</a></td><td>${E(x.motivo)}</td><td class="text-xs">${E(x.detalle||'')}</td><td>${btn('Resuelto','res')}</td></tr>`).join('')+'</table></div>':'<p class="opacity-70 text-sm">Sin reportes abiertos.</p>')
   +'<h2 class="font-bold mt-6">Usuarios reportados (chat)</h2>'+((u.data||[]).length?'<ul class="text-sm mt-2 space-y-1">'+u.data.map(x=>`<li class="bg-white dark:bg-slate-800 rounded p-2">${fecha(x.created_at)} · conv #${x.conversacion_id??'–'} · usuario ${E((x.reported_id||'').slice(0,8))}… · ${E(x.motivo)}</li>`).join('')+'</ul>':'<p class="opacity-70 text-sm">Ninguno.</p>')},
  async(el,a,card)=>{const {error}=await C.from('reportes').update({estado:'resuelto'}).eq('id',card.dataset.id);if(error)throw error;card.remove()}],
 retiros:['📰 Retiros',async()=>{const {data,error}=await C.from('retiros').select('*').order('created_at',{ascending:false}).limit(200);if(error)throw error;
  return data.length?data.map(x=>`<article class="bg-white dark:bg-slate-800 rounded-xl shadow p-4 mb-3" data-id="${x.id}"><div class="flex flex-wrap gap-2 items-center"><b>${E(x.listing_ref)}</b><span class="text-xs rounded-full px-2 ${x.estado==='pendiente'?'bg-amber-100 text-amber-900':'bg-slate-200 dark:bg-slate-700'}">${E(x.estado)}</span><span class="text-xs opacity-60 ml-auto">${fecha(x.created_at)}</span></div><p class="text-sm mt-1">${E(x.nombre)} (<a class="underline" href="mailto:${E(x.email)}?subject=${encodeURIComponent('Tu solicitud de retiro en MapMarket')}">${E(x.email)}</a>) · ${E(x.relacion)}</p><p class="text-sm mt-1 whitespace-pre-wrap opacity-80">${E(x.motivo)}</p>
   <div class="flex flex-wrap gap-2 mt-2">${btn('Marcar retirado','retirado')}${btn('Corregido','corregido')}${btn('Rechazar','rechazado')}<a class="underline text-sm self-center" target="_blank" href="index.html?p=${encodeURIComponent(x.listing_ref)}">abrir anuncio</a></div><p class="text-[11px] opacity-60 mt-1">Para retirar un anuncio scrapeado: añade su id a <code>scripts/excluidos.json</code> y ejecuta update.py (lo borra y evita que vuelva).</p></article>`).join(''):'<p class="opacity-70">Sin solicitudes.</p>'},
  async(el,a,card)=>{const {error}=await C.from('retiros').update({estado:a}).eq('id',card.dataset.id);if(error)throw error;card.querySelector('span').textContent=a}],
 privados:['🔒 Datos privados',async()=>{setTimeout(()=>{const go=async()=>{const t=$('pvT').value,q=$('pvQ').value.trim(),pv=$('pvP').value;let r=C.from(t).select(t==='privado_propiedades'?'id,fuente,titulo,tipo,precio,moneda,provincia,url,importado_at':'id,kind,fuente,titulo,provincia,canton,fecha,url,importado_at',{count:'exact'}).order(t==='privado_remates'?'fecha':'titulo',{ascending:true}).limit(200);if(q)r=r.ilike('titulo','%'+q.replace(/[%_,()]/g,' ')+'%');if(pv)r=r.eq('provincia',pv);const {data,count,error}=await r;if(error){$('pvR').textContent=error.message;return}
   $('pvR').innerHTML=`<p class="text-xs opacity-70 mb-1">${count} registros (mostrando ${data.length})</p><div class="overflow-x-auto"><table class="w-full text-xs"><tr class="text-left opacity-60">${Object.keys(data[0]||{}).filter(k=>k!=='importado_at').map(k=>`<th class="pr-2">${k}</th>`).join('')}</tr>${data.map(x=>'<tr class="border-t dark:border-slate-700">'+Object.entries(x).filter(([k])=>k!=='importado_at').map(([k,v])=>`<td class="pr-2 py-1">${k==='url'&&v?`<a class="underline" target="_blank" rel="noopener noreferrer" href="${E(v)}">abrir</a>`:k==='precio'&&v?Number(v).toLocaleString('es-CR'):E(v)}</td>`).join('')+'</tr>').join('')}</table></div>`};
  ['pvT','pvP'].forEach(i=>$(i).onchange=go);$('pvQ').oninput=()=>{clearTimeout(window._pv);window._pv=setTimeout(go,300)};go()});
  return `<div class="rounded-lg bg-amber-100 dark:bg-amber-900/50 text-amber-900 dark:text-amber-100 text-xs p-2 mb-3">🔒 Contenido de terceros (captura del 10 oct 2026). Solo visible para administradores; no se publica. Las fotos se guardan solo como URL y no se muestran.</div><div class="flex flex-wrap gap-2"><select id="pvT" aria-label="Tabla" class="h-10 px-2 rounded-lg border dark:bg-slate-700 dark:border-slate-600"><option value="privado_propiedades">Anuncios (Encuentra24/Anuntico)</option><option value="privado_remates">Remates y adjudicados</option></select><select id="pvP" aria-label="Provincia" class="h-10 px-2 rounded-lg border dark:bg-slate-700 dark:border-slate-600"><option value="">Todas las provincias</option>${['San José','Alajuela','Cartago','Heredia','Guanacaste','Puntarenas','Limón'].map(p=>`<option>${p}</option>`).join('')}</select><input id="pvQ" placeholder="Buscar en título…" aria-label="Buscar" class="flex-1 min-w-[160px] h-10 px-2 rounded-lg border dark:bg-slate-700 dark:border-slate-600"></div><div id="pvR" class="mt-3">Cargando…</div>`}],
 soporte:['💬 Soporte',async()=>{const {data,error}=await C.from('conversaciones').select('*').is('owner_id',null).order('last_at',{ascending:false}).limit(100);if(error)throw error;
  return '<p class="text-sm opacity-70">Conversaciones dirigidas a «MapMarket soporte» (anuncios sin dueño). Respóndelas desde la bandeja.</p>'+(data.length?'<ul class="mt-2 space-y-1">'+data.map(c=>`<li><a class="block bg-white dark:bg-slate-800 rounded-lg p-3 text-sm" href="mensajes.html?c=${c.id}">#${c.id} · anuncio ${E(c.listing_id)} · ${fecha(c.last_at)}</a></li>`).join('')+'</ul>':'<p class="opacity-70 mt-2">Sin conversaciones.</p>')}]
};
let cur='moderacion';
async function show(k){cur=k;$('tabs').querySelectorAll('button').forEach(b=>{b.setAttribute('aria-selected',b.dataset.k===k);b.className='rounded-full px-4 whitespace-nowrap '+(b.dataset.k===k?'bg-teal-600 text-white':'border dark:border-slate-600')});$('out').textContent='Cargando…';
 try{$('out').innerHTML=await T[k][1]()}catch(e){$('out').innerHTML='<p class="text-red-600">'+E(e.message)+'</p>'}}
$('out').addEventListener('click',async e=>{const b=e.target.closest('button[data-a]');if(!b||!T[cur][2])return;b.disabled=true;try{await T[cur][2](b,b.dataset.a,b.closest('[data-id]'))}catch(er){alert(er.message);b.disabled=false}});
(async()=>{const u=await Auth.user();if(!u){location.href='login.html?next=admin.html';return}
 C=await Auth.client();const {data:adm}=await C.rpc('es_admin');if(!adm){$('out').innerHTML='<p>🔒 Esta sección es solo para administradores (perfil con <code>rol = admin</code>).</p>';return}
 $('tabs').innerHTML=Object.entries(T).map(([k,[t]])=>`<button role="tab" data-k="${k}" style="min-height:44px">${t}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.k));show('moderacion')})();
</script></body></html>
