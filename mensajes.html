<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d9488"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/favicon.png"><script>if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:"class"}</script><script src="js/config.js"></script><script src="js/auth.js"></script><script>Auth.theme()</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:"class"}</script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/social.js"></script><script>Auth.theme()</script><title>Mensajes · MapMarket</title>
<style>html,body{height:100%}.bub{animation:b .2s ease-out}@keyframes b{from{opacity:0;transform:translateY(6px)}}</style></head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col h-full">
<header class="shrink-0 bg-white dark:bg-slate-800 border-b dark:border-slate-700 flex items-center gap-2 px-3 py-2.5"><a href="index.html" class="font-bold text-teal-700 dark:text-teal-400">📍 MapMarket</a><span class="text-sm opacity-70">· 💬 Mensajes</span><a href="index.html" class="ml-auto text-sm">🗺️ Mapa</a></header>
<div id="note" class="hidden shrink-0 text-xs bg-amber-100 dark:bg-amber-900/50 text-amber-900 dark:text-amber-100 px-3 py-2"></div>
<div class="flex-1 min-h-0 flex">
 <aside id="list" class="w-full md:w-80 md:border-r dark:border-slate-700 overflow-y-auto bg-white dark:bg-slate-800"></aside>
 <section id="thread" class="hidden md:flex flex-1 flex-col min-w-0">
  <div id="thHead" class="shrink-0 flex items-center gap-2 px-3 py-2 bg-white dark:bg-slate-800 border-b dark:border-slate-700"><button id="back" class="md:hidden text-xl px-1">←</button><div class="min-w-0 flex-1"><div id="thTitle" class="font-semibold truncate">Elige una conversación</div><div id="thSub" class="text-[11px] opacity-60 truncate"></div></div><button id="thMenu" class="hidden px-2 text-xl" aria-label="Opciones">⋮</button></div>
  <div id="msgs" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
  <form id="send" class="hidden shrink-0 flex gap-2 p-2 bg-white dark:bg-slate-800 border-t dark:border-slate-700" style="padding-bottom:max(.5rem,env(safe-area-inset-bottom))"><textarea id="txt" rows="1" maxlength="1000" placeholder="Escribe un mensaje…" class="flex-1 resize-none px-3 py-2 rounded-2xl border bg-slate-50 dark:bg-slate-700 dark:border-slate-600 max-h-32"></textarea><button class="bg-teal-600 text-white rounded-full w-11 h-11 shrink-0" aria-label="Enviar">➤</button></form>
 </section>
</div>
<script>
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let C=null,U=null,convs=[],cur=null,props={},chan=null;const DEMO=location.hash==='#demo';
const hora=t=>new Date(t).toLocaleString('es-CR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const title=c=>props[c.listing_id]?.title||('Anuncio '+c.listing_id);
const otro=c=>c.owner_id==null?(c.user_id===U.id?'MapMarket soporte':'Usuario'):(c.user_id===U.id?'Agente del anuncio':'Interesado');
const note=t=>{$('note').innerHTML=t;$('note').classList.remove('hidden')};
function renderList(){$('list').innerHTML=convs.length?convs.map(c=>`<button data-id="${c.id}" class="cv w-full text-left px-3 py-3 border-b dark:border-slate-700 flex gap-3 items-center ${cur&&cur.id===c.id?'bg-teal-50 dark:bg-slate-700':''}"><div class="w-10 h-10 rounded-full bg-cover bg-center bg-teal-600 shrink-0 flex items-center justify-center text-white" style="background-image:url('${E(props[c.listing_id]?.images?.[0]||'')}')">${props[c.listing_id]?.images?.[0]?'':'🏠'}</div><div class="min-w-0 flex-1"><div class="flex"><b class="truncate flex-1 text-sm">${E(title(c))}</b><span class="text-[10px] opacity-60 ml-1">${hora(c.last_at)}</span></div><div class="text-xs opacity-70 truncate">${E(otro(c))} · ${E(c.ultimo||'')}</div></div>${c.unread?`<span class="bg-rose-600 text-white text-[10px] rounded-full px-1.5">${c.unread}</span>`:''}</button>`).join(''):'<div class="p-6 text-sm opacity-70 text-center">No tienes conversaciones todavía.<br>Abre una propiedad en el mapa y toca <b>✉️ Enviar mensaje</b>.</div>';
 document.querySelectorAll('.cv').forEach(b=>b.onclick=()=>openConv(+b.dataset.id))}
function bubble(m){const mine=m.sender_id===U.id;return `<div class="bub flex ${mine?'justify-end':''}"><div class="max-w-[80%] rounded-2xl px-3 py-2 text-sm shadow-sm ${mine?'bg-teal-600 text-white rounded-br-sm':'bg-white dark:bg-slate-800 rounded-bl-sm'}"><div class="whitespace-pre-wrap break-words">${E(m.texto)}</div><div class="text-[10px] mt-0.5 ${mine?'text-teal-100':'opacity-50'} text-right">${hora(m.created_at)}${mine?(m.leido?' · ✓✓':' · ✓'):''}</div></div></div>`}
async function loadMsgs(){if(DEMO)return;const {data,error}=await C.from('mensajes').select('*').eq('conversacion_id',cur.id).order('created_at').limit(500);if(error){note(E(error.message));return}cur.msgs=data;drawMsgs();C.rpc('marcar_leidos',{conv:cur.id}).then(()=>{const c=convs.find(x=>x.id===cur.id);if(c){c.unread=0;renderList()}})}
function drawMsgs(){$('msgs').innerHTML=(cur.msgs||[]).map(bubble).join('')||'<div class="text-center text-sm opacity-60 mt-8">Escribe el primer mensaje. Sé claro y respetuoso; no compartas datos bancarios por chat.</div>';$('msgs').scrollTop=1e9}
function openConv(id){cur=convs.find(c=>c.id===id);if(!cur)return;history.replaceState(null,'','?c='+id+(DEMO?'#demo':''));$('thread').classList.remove('hidden');$('thread').classList.add('flex');if(innerWidth<768)$('list').classList.add('hidden');
 $('thTitle').textContent=title(cur);$('thSub').innerHTML=E(otro(cur))+(props[cur.listing_id]?` · <a class="underline" href="index.html?p=${encodeURIComponent(cur.listing_id)}">ver anuncio</a>`:'');$('send').classList.remove('hidden');$('thMenu').classList.remove('hidden');renderList();
 if(DEMO){drawMsgs();return}loadMsgs();
 if(chan)C.removeChannel(chan);chan=C.channel('conv-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'mensajes',filter:'conversacion_id=eq.'+id},p=>{if(!(cur.msgs||[]).some(m=>m.id===p.new.id)){cur.msgs=(cur.msgs||[]).concat(p.new);drawMsgs();if(p.new.sender_id!==U.id)C.rpc('marcar_leidos',{conv:id})}}).subscribe()}
$('back').onclick=()=>{$('list').classList.remove('hidden');$('thread').classList.add('hidden');$('thread').classList.remove('flex')};
$('txt').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,128)+'px'});
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>=768){e.preventDefault();$('send').requestSubmit()}});
$('send').onsubmit=async e=>{e.preventDefault();const t=$('txt').value.trim();if(!t||!cur)return;if(t.length>1000)return alert('Máximo 1000 caracteres.');
 if(DEMO){cur.msgs.push({id:Date.now(),sender_id:U.id,texto:t,created_at:new Date().toISOString()});$('txt').value='';drawMsgs();return}
 $('txt').disabled=true;const {data,error}=await C.from('mensajes').insert({conversacion_id:cur.id,texto:t}).select().single();$('txt').disabled=false;
 if(error){alert(/Demasiados|Límite|No puedes/.test(error.message)?error.message:'No se pudo enviar: '+error.message);return}$('txt').value='';$('txt').style.height='auto';if(!cur.msgs.some(m=>m.id===data.id)){cur.msgs.push(data);drawMsgs()}};
$('thMenu').onclick=async()=>{const o=cur.user_id===U.id?cur.owner_id:cur.user_id;const op=prompt('Opciones:\n1 = Bloquear a este usuario\n2 = Reportar conversación\n(escribe 1 o 2)');
 if(op==='1'){if(!o)return alert('No puedes bloquear al soporte.');const {error}=await C.from('bloqueos').insert({blocked_id:o});alert(error?error.message:'Usuario bloqueado: ya no podrá escribirte.')}
 if(op==='2'){const m=prompt('¿Qué pasó? (spam, estafa, acoso…)');if(!m)return;const {error}=await C.from('reportes_usuarios').insert({reported_id:o,conversacion_id:cur.id,motivo:m.slice(0,500)});alert(error?error.message:'Gracias, revisaremos el reporte.')}};
(async()=>{
 fetch('data/propiedades.json').then(r=>r.json()).then(a=>{(a.properties||a).forEach(p=>props[String(p.id)]=p);renderList();if(cur)$('thTitle').textContent=title(cur)}).catch(()=>{});
 if(DEMO){U={id:'yo'};note('👀 Vista de ejemplo con datos ficticios (no se envía nada).');const t=Date.now();convs=[{id:1,listing_id:'anun-54882',user_id:'yo',owner_id:'ag',last_at:new Date(t-6e5).toISOString(),ultimo:'Sí, el sábado a las 10 am le sirve?',unread:1,msgs:[{id:1,sender_id:'yo',texto:'Hola, ¿la casa sigue disponible? Me interesa visitarla este fin de semana.',created_at:new Date(t-36e5).toISOString(),leido:true},{id:2,sender_id:'ag',texto:'¡Hola! Sí, sigue disponible. Tiene escritura al día y plano catastrado.',created_at:new Date(t-3e6).toISOString()},{id:3,sender_id:'ag',texto:'Sí, el sábado a las 10 am le sirve?',created_at:new Date(t-6e5).toISOString()}]},{id:2,listing_id:'32136583',user_id:'yo',owner_id:null,last_at:new Date(t-864e5).toISOString(),ultimo:'Gracias, lo revisamos.',msgs:[{id:4,sender_id:'yo',texto:'Este anuncio parece vendido.',created_at:new Date(t-9e7).toISOString(),leido:true},{id:5,sender_id:'s',texto:'Gracias, lo revisamos.',created_at:new Date(t-864e5).toISOString()}]}];renderList();openConv(1);return}
 U=await Social.me();if(!U){location.href='login.html?next=mensajes.html';return}
 C=await Social.sb();if(!C){note('Los mensajes se activan cuando el administrador ejecute <b>supabase_setup.sql</b> (v4). <a class="underline" href="#demo" onclick="setTimeout(()=>location.reload())">Ver ejemplo</a>');renderList();return}
 const {data,error}=await C.from('conversaciones').select('*').order('last_at',{ascending:false});if(error){note(E(error.message));return}convs=data||[];
 if(convs.length){const ids=convs.map(c=>c.id);const {data:ms}=await C.from('mensajes').select('conversacion_id,texto,sender_id,leido,created_at').in('conversacion_id',ids).order('created_at',{ascending:false}).limit(500);
  (ms||[]).forEach(m=>{const c=convs.find(x=>x.id===m.conversacion_id);if(!c.ultimo)c.ultimo=m.texto;if(!m.leido&&m.sender_id!==U.id)c.unread=(c.unread||0)+1})}
 renderList();const q=+new URLSearchParams(location.search).get('c');if(q)openConv(q);
 C.channel('mm-list').on('postgres_changes',{event:'INSERT',schema:'public',table:'mensajes'},p=>{const c=convs.find(x=>x.id===p.new.conversacion_id);if(c){c.ultimo=p.new.texto;c.last_at=p.new.created_at;if(p.new.sender_id!==U.id&&(!cur||cur.id!==c.id))c.unread=(c.unread||0)+1;convs.sort((a,b)=>b.last_at>a.last_at?1:-1);renderList()}}).subscribe();
})();
</script></body></html>
