<style>article{animation:f .3s ease-out}@keyframes f{from{opacity:0;transform:translateY(8px)}}</style></head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
<header class="sticky top-0 z-10 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b dark:border-slate-700"><div class="max-w-4xl mx-auto flex items-center gap-3 px-4 py-3"><a href="index.html" class="font-bold text-teal-700 dark:text-teal-400">📍 MapMarket</a><span class="text-sm opacity-70">📚 Guías</span><a href="index.html" class="ml-auto text-sm">🗺️ Mapa</a></div></header>
<main class="max-w-4xl mx-auto p-4"><h1 class="text-3xl font-extrabold mt-4">Guías para comprar en Costa Rica</h1><p class="opacity-70 mt-1">Resúmenes prácticos. Cifras de referencia (reportadas, oct 2026): confirma siempre con tu banco, notario y la municipalidad.</p>
<div id="idx" class="flex flex-wrap gap-2 mt-4"></div><div id="arts" class="space-y-4 mt-6"></div>
<p class="text-xs opacity-60 mt-8">Información general, no es asesoría legal ni financiera. Contrata un abogado/notario independiente.</p></main>
<script>
const A=[
['checklist','✅','Checklist de debida diligencia',`<ol class="list-decimal ml-5 space-y-1"><li><b>Estudio de títulos</b>: pide la certificación literal en el Registro Nacional (dueño, gravámenes, hipotecas, anotaciones).</li><li><b>Plano catastrado</b>: que coincida con la finca y con lo que ves en el terreno.</li><li><b>Uso de suelo</b> en la municipalidad: confirma qué se puede construir.</li><li><b>Disponibilidad de agua</b> (AyA o ASADA) y electricidad.</li><li><b>Impuestos municipales al día</b> (bienes inmuebles, servicios).</li><li><b>Acceso legal</b>: calle pública o servidumbre inscrita.</li><li><b>Permisos de construcción</b> de lo edificado.</li><li>En costa: <b>zona marítimo terrestre</b> (los primeros 200 m tienen régimen de concesión).</li></ol>`],
['cierre','📝','Proceso de cierre paso a paso',`<ol class="list-decimal ml-5 space-y-1"><li>Oferta y negociación; firma de <b>opción de compra</b> o carta de intención con depósito.</li><li>Debida diligencia (ver checklist) y, si hay crédito, <b>avalúo</b> y aprobación del banco.</li><li>Firma de la <b>escritura</b> ante notario; pago del saldo (idealmente por depósito en garantía/escrow).</li><li>El notario <b>inscribe</b> el traspaso en el Registro Nacional; verifica la inscripción a tu nombre.</li><li>Cambia servicios (agua, luz) y declara el inmueble en la municipalidad.</li></ol>`],
['gastos','💸','Gastos de cierre e impuestos',`<ul class="list-disc ml-5 space-y-1"><li>Impuesto de traspaso: <b>1,5 %</b> del valor.</li><li>Honorarios notariales: <b>1–1,5 %</b> + 13 % IVA.</li><li>Timbres y registro: <b>0,5–0,8 %</b>; estudio registral ₡50 000–150 000.</li><li>Total típico: <b>3,5–4,5 %</b> del precio (más gastos del crédito 2–3,5 % si financias).</li><li>Recurrentes: impuesto de bienes inmuebles <b>0,25 % anual</b> (trimestral); impuesto solidario si la construcción supera ~₡143M (0,25–0,55 %); cuota condominal; seguros.</li></ul><p class="mt-2">Usa la 🧮 Calculadora del mapa para estimarlo con la propiedad elegida.</p>`],
['hipoteca','🏦','Cómo elegir una hipoteca',`<ul class="list-disc ml-5 space-y-1"><li>Compara la <b>tasa total</b>: muchas son tasa fija inicial y luego variable (TBP + margen). Pregunta el margen.</li><li>La cuota no debería pasar del <b>30–40 %</b> de tu ingreso neto.</li><li>Moneda: endeúdate en la moneda en que ganas para evitar riesgo cambiario.</li><li>Pide la <b>TITA</b> (tasa total) y el detalle de seguros, comisiones y formalización.</li><li>Bancos públicos ofrecen financiamiento hasta 95 % en colones en algunos programas; revisa el bono BANHVI si calificas.</li></ul><p class="mt-2">El comparador de bancos está en la 🧮 Calculadora.</p>`],
['remates','⚖️','Remates judiciales y bienes adjudicados',`<ul class="list-disc ml-5 space-y-1"><li><b>Remates</b>: se publican por edicto en el Boletín Judicial con la base del 1.er remate; si no hay postor, 2.º remate al 75 % y 3.º al 25 % de la base.</li><li>Para participar se suele depositar alrededor del <b>50 % de la base</b>; revisa el edicto para plazos y forma.</li><li>Revisa el expediente y el Registro: gravámenes que <b>no</b> se cancelan, ocupantes, estado físico (normalmente no se puede visitar).</li><li><b>Adjudicados</b> (venta directa de bancos): precio fijo o con descuento, a veces con financiamiento del propio banco.</li><li>Consulta un abogado antes de ofertar.</li></ul>`],
['ofertas','🤝','Consejos para negociar y evitar estafas',`<ul class="list-disc ml-5 space-y-1"><li>Compara el precio con la <b>mediana de la zona</b> (📊 Datos de zona en el mapa).</li><li>Nunca pagues depósitos a cuentas personales sin contrato ni verificación del dueño registral.</li><li>Desconfía de precios muy por debajo del mercado o presión por pagar rápido.</li><li>Visita la propiedad, habla con vecinos y revisa la zona de noche.</li><li>Reporta anuncios sospechosos con 🚩 Reportar en la ficha.</li></ul>`]];
document.getElementById('idx').innerHTML=A.map(a=>`<a href="#${a[0]}" class="bg-white dark:bg-slate-800 rounded-full px-3 py-1.5 shadow text-sm">${a[1]} ${a[2]}</a>`).join('');
document.getElementById('arts').innerHTML=A.map(a=>`<article id="${a[0]}" class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5 scroll-mt-20"><h2 class="text-xl font-bold">${a[1]} ${a[2]}</h2><div class="text-sm mt-3 leading-relaxed">${a[3]}</div></article>`).join('');
</script></body></html>
