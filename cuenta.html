<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d9488"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/favicon.png"><script>if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:"class"}</script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/datos.js" defer></script><script>Auth.theme()</script><title>Mi cuenta · MapMarket</title><meta name="description" content="Tu cuenta MapMarket."><link rel="canonical" href="https://mapmarketapp.com/cuenta.html"><meta name="robots" content="noindex,follow"><meta property="og:type" content="website"><meta property="og:site_name" content="MapMarket"><meta property="og:title" content="Mi cuenta · MapMarket"><meta property="og:description" content="Tu cuenta MapMarket."><meta property="og:image" content="https://mapmarketapp.com/icons/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:url" content="https://mapmarketapp.com/cuenta.html"><meta property="og:locale" content="es_CR"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://mapmarketapp.com/icons/og.png"><script src="js/i18n.js"></script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
<header class="bg-white dark:bg-slate-800 border-b dark:border-slate-700"><div class="max-w-3xl mx-auto flex items-center gap-3 px-4 py-3"><a href="index.html" class="font-bold text-teal-700 dark:text-teal-400">📍 MapMarket</a><a href="index.html" class="ml-auto text-sm">🗺️ Mapa</a><a href="planes.html" class="text-sm text-violet-600 font-semibold">⭐ Plus</a></div></header>
<main class="max-w-3xl mx-auto p-4 space-y-4" id="m"><p>Cargando…</p></main>
<script>
const $=i=>document.getElementById(i);
async function render(){const u=await Auth.user();if(!u){location.href='login.html?next=cuenta.html';return}
 const favs=await Auth.favoritos(),bus=await Auth.busquedas(),plus=u.plan==='plus';
 $('m').innerHTML=`<section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5 flex items-center gap-4"><div class="w-14 h-14 rounded-full bg-teal-600 text-white flex items-center justify-center text-2xl font-bold">${u.nombre[0].toUpperCase()}</div><div><h1 class="text-xl font-bold">${u.nombre}</h1><p class="text-sm opacity-70">${u.email}</p></div><span class="ml-auto text-sm rounded-full px-3 py-1 ${u.nivel==='pro'?'bg-amber-400 text-amber-950':plus?'bg-violet-600 text-white':'bg-slate-200 dark:bg-slate-700'}">${u.nivel==='pro'?'💎 Pro':plus?'⭐ Plus':'Gratis'}</span></section>
 <section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5"><h2 class="font-bold">Plan</h2>${u.trial_activo?`<div class="mt-2 rounded-xl bg-violet-100 dark:bg-violet-900/50 text-violet-800 dark:text-violet-200 p-3 text-sm">⏳ <b>${Auth.pruebaTexto(u)}</b> · termina el ${new Date(u.trial_ends_at).toLocaleString('es-CR')} — luego vuelves a Gratis sin cobro.</div>`:''}
  <p class="text-sm mt-2">${u.pagado?'Tienes MapMarket '+(u.nivel==='pro'?'Pro':'Plus')+' activo'+(u.plus_until?' hasta el '+new Date(u.plus_until).toLocaleDateString('es-CR'):'')+'.':u.trial_activo?'Estás probando Plus gratis.':'Estás en el plan Gratis ('+((GH_CONFIG.limitesAnuncios||{}).free||1)+' anuncio activo, hasta '+GH_CONFIG.limiteFavoritosGratis+' favoritos).'+(u.trial_used?' Tu prueba gratis ya fue utilizada.':'')}</p>
  <div class="mt-3 flex flex-wrap gap-2">${u.pagado?(Auth.demo?'<button id="down" class="border rounded-lg px-3 py-1.5 text-sm">Volver a Gratis (demo)</button>':'<span id="subBox" class="text-xs opacity-70">Cargando suscripción…</span>'+(u.nivel!=='pro'?'<a href="planes.html" class="border border-amber-500 text-amber-700 dark:text-amber-300 rounded-lg px-3 py-1.5 text-sm">💎 Pasar a Pro · ₡6.990/mes</a>':'')+'<span class="hidden">Para cancelar, escríbenos o usa el enlace del recibo de ONVO.</span>'):(!u.trial_used?'<button id="trial" class="bg-violet-600 text-white rounded-lg px-3 py-1.5 text-sm">🎁 Prueba Plus gratis 2 días</button>':'')+'<a href="planes.html" class="border border-violet-600 text-violet-700 dark:text-violet-300 rounded-lg px-3 py-1.5 text-sm">Ver planes · Plus ₡3.990/mes o ₡29.990/año · Pro ₡6.990/mes</a>'+(Auth.demo&&u.trial_activo?'<button id="down" class="border rounded-lg px-3 py-1.5 text-sm">Terminar prueba (demo)</button>':'')}</div></section>
 <section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5"><h2 class="font-bold">❤️ Favoritos (${favs.length}${plus?'':' / '+GH_CONFIG.limiteFavoritosGratis})</h2><p class="text-sm opacity-70 mt-1">${favs.length?favs.slice(0,30).join(', '):'Aún no tienes favoritos: toca el corazón en la ficha de una propiedad.'}</p></section>
 <section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5"><h2 class="font-bold">🔔 Búsquedas guardadas y alertas ${plus?'':'<span class="text-xs bg-violet-100 text-violet-700 rounded-full px-2">🔒 Plus</span>'}</h2>${bus.length?'<ul class="text-sm mt-2 list-disc ml-5">'+bus.map(b=>'<li>'+(b.nombre||'Búsqueda')+(b.alerta?' · alerta activa':'')+'</li>').join('')+'</ul>':'<p class="text-sm opacity-70 mt-1">Ninguna todavía.</p>'}</section>
 <section id="np" class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5 ${location.hash==='#nueva-clave'?'':'hidden'}"><h2 class="font-bold">Nueva contraseña</h2><input id="pw" type="password" minlength="6" class="mt-2 w-full px-3 py-2 rounded-lg border dark:bg-slate-700"><button id="pwB" class="mt-2 bg-teal-600 text-white rounded-lg px-3 py-1.5 text-sm">Guardar</button><p id="pwM" class="text-sm mt-1"></p></section>
 <section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5"><h2 class="font-bold">🏠 Mis anuncios publicados</h2><div id="misAn" class="text-sm mt-2 opacity-80">${Auth.demo?'No disponible en modo demo.':'Cargando…'}</div></section>${u.rol==='admin'?'<a href="admin.html" class="block text-center bg-slate-800 text-white rounded-xl font-semibold py-3">🛠️ Panel de administración</a>':''}
 <section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5"><h2 class="font-bold">🧾 Historial de pagos</h2><div id="pagos" class="text-sm mt-2 opacity-80">${Auth.demo?'No disponible en modo demo.':'Cargando…'}</div><p class="text-xs opacity-60 mt-2">Los pagos los procesa ONVO Pay; MapMarket no guarda datos de tu tarjeta. ¿Dudas? <a class="underline" href="mailto:pcalifax@gmail.com">pcalifax@gmail.com</a></p></section>
 <button id="out" class="w-full border border-red-500 text-red-600 rounded-xl font-semibold" style="min-height:44px">Cerrar sesión</button>
 <section class="rounded-2xl border border-red-300 dark:border-red-800 p-5"><h2 class="font-bold text-red-600">Eliminar mi cuenta</h2><p class="text-sm mt-1 opacity-80">Borra definitivamente tu cuenta, perfil, favoritos, listas, alertas, votos y mensajes, y cancela tu suscripción. No se puede deshacer. También puedes pedirlo por correo a pcalifax@gmail.com (ver <a class="underline" href="eliminar-cuenta.html">cómo eliminar tu cuenta</a>).</p>
 <label class="block text-sm mt-3">Escribe <b>ELIMINAR</b> para confirmar<input id="delC" autocomplete="off" class="mt-1 w-full h-11 px-3 rounded-lg border dark:bg-slate-700 dark:border-slate-600"></label><button id="delB" class="mt-2 bg-red-600 text-white rounded-lg px-4 font-semibold disabled:opacity-40" style="min-height:44px" disabled>Eliminar cuenta definitivamente</button><p id="delM" role="status" class="text-sm mt-2"></p></section>`;
 extras(u);
 if($('trial'))$('trial').onclick=async()=>{try{await Auth.startTrial();render()}catch(e){alert(e.message)}};$('out').onclick=async()=>{await Auth.signOut();location.href='index.html'};if($('down'))$('down').onclick=async()=>{await Auth.setDemoPlan('gratis');render()};
 $('pwB').onclick=async()=>{try{$('pwM').textContent=await Auth.updatePassword($('pw').value)}catch(e){$('pwM').textContent=e.message}}}
async function fnCuenta(body){const c=await Auth.client();const {data,error}=await c.functions.invoke('cuenta',{body});if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw new Error(m)}return data}
async function extras(u){
 $('delC').oninput=e=>$('delB').disabled=e.target.value.trim()!=='ELIMINAR';
 $('delB').onclick=async()=>{if(!confirm('¿Seguro? Esto borra tu cuenta de MapMarket para siempre.'))return;$('delB').disabled=true;$('delM').textContent='Eliminando…';
  try{if(Auth.demo){localStorage.clear();location.href='index.html';return}await fnCuenta({accion:'eliminar',confirmar:'ELIMINAR'});await Auth.signOut().catch(()=>{});localStorage.removeItem('mm_ultimo_email');alert('Tu cuenta fue eliminada.');location.href='index.html'}catch(e){$('delM').textContent='❌ '+e.message;$('delB').disabled=false}};
 if(Auth.demo)return;
 try{const c=await Auth.client();const {data}=await c.from('anuncios').select('id,titulo,estado,motivo_rechazo,created_at').eq('owner_id',u.id).order('created_at',{ascending:false});const B={pendiente:'🕓 En revisión',aprobado:'✅ Publicado',rechazado:'❌ Rechazado',vendido:'🏷️ Vendido',retirado:'🗑️ Retirado'};const X=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
  $('misAn').innerHTML=(data||[]).length?'<ul class="divide-y dark:divide-slate-700">'+data.map(a=>`<li class="py-2 flex flex-wrap gap-2 items-center"><span class="flex-1">${X(a.titulo)}</span><span class="text-xs">${B[a.estado]||a.estado}${a.motivo_rechazo?' · '+X(a.motivo_rechazo):''}</span>${a.estado==='aprobado'?`<a class="underline text-xs" href="index.html?p=u-${a.id}">ver</a><button data-v="${a.id}" class="mv border rounded px-2 text-xs" style="min-height:36px">Marcar vendido</button>`:''}${a.estado!=='retirado'?`<button data-r="${a.id}" class="mr border border-red-400 text-red-600 rounded px-2 text-xs" style="min-height:36px">Retirar</button>`:''}</li>`).join('')+'</ul>':'Aún no publicas anuncios. Usa «➕ Publicar» en el mapa.';
  document.querySelectorAll('.mv,.mr').forEach(b=>b.onclick=async()=>{const {error}=await c.from('anuncios').update({estado:b.dataset.v?'vendido':'retirado'}).eq('id',b.dataset.v||b.dataset.r);if(error)alert(error.message);else extras(u)})}catch(e){$('misAn').textContent='No disponible.'}
 try{const r=await fnCuenta({accion:'pagos'});const fm=n=>n==null?'':'₡'+Math.round(n>100000?n/100:n).toLocaleString('es-CR');
  const L={'checkout-session.succeeded':'✅ Pago de suscripción','subscription.renewal.succeeded':'🔄 Renovación','subscription.renewal.failed':'⚠️ Pago fallido','checkout.created':'🕓 Pago iniciado','subscription.canceled.by_user':'🚫 Suscripción cancelada'};
  $('pagos').innerHTML=r.items.length?'<ul class="divide-y dark:divide-slate-700">'+r.items.map(i=>`<li class="py-1.5 flex gap-2"><span class="flex-1">${L[i.evento]||i.evento}${i.plan?' · '+i.plan:''}</span><span>${fm(i.monto)}</span><span class="opacity-60 text-xs">${new Date(i.fecha).toLocaleDateString('es-CR')}</span></li>`).join('')+'</ul>':'Aún no tienes pagos.';
  const sb=$('subBox');if(sb){const s=r.suscripcion;if(s.activa){sb.innerHTML='<button id="cancelSub" class="border border-red-500 text-red-600 rounded-lg px-3 text-sm" style="min-height:44px">Cancelar suscripción</button>';$('cancelSub').onclick=async()=>{if(!confirm('¿Cancelar la renovación automática? Conservas Plus hasta el '+new Date(s.plus_until).toLocaleDateString('es-CR')+'.'))return;try{await fnCuenta({accion:'cancelar'});alert('Suscripción cancelada. No se te cobrará de nuevo.');render()}catch(e){alert(e.message)}}}
   else sb.textContent=s.cancelada_at?'Suscripción cancelada: no se renovará. Plus activo hasta el '+new Date(s.plus_until).toLocaleDateString('es-CR')+'.':'Para cancelar, escríbenos a pcalifax@gmail.com.'}
 }catch(e){$('pagos').textContent='No se pudo cargar el historial ('+e.message+').'}}
if(new URLSearchParams(location.search).get('pago')==='ok'){const b=document.createElement('div');b.className='max-w-3xl mx-auto mt-3 mx-4 rounded-xl bg-emerald-100 text-emerald-900 p-3 text-sm';b.textContent='✅ ¡Gracias! Recibimos tu pago con ONVO. Plus se activa en cuanto ONVO nos confirma (normalmente segundos); recarga si aún ves Gratis.';document.querySelector('header').after(b);let n=0;const t=setInterval(()=>{render();if(++n>6)clearInterval(t)},5000)}render();Auth.banner();setInterval(render,6e4);
</script><script src="js/mm-extra.js" defer></script><script src="js/notif.js" defer></script></body></html>
