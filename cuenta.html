<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:"class"}</script><script src="js/config.js"></script><script src="js/auth.js"></script><script>Auth.theme()</script><title>Mi cuenta · GeoHogar</title></head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
<header class="bg-white dark:bg-slate-800 border-b dark:border-slate-700"><div class="max-w-3xl mx-auto flex items-center gap-3 px-4 py-3"><a href="index.html" class="font-bold text-teal-700 dark:text-teal-400">📍 GeoHogar</a><a href="index.html" class="ml-auto text-sm">🗺️ Mapa</a><a href="planes.html" class="text-sm text-violet-600 font-semibold">⭐ Plus</a></div></header>
<main class="max-w-3xl mx-auto p-4 space-y-4" id="m"><p>Cargando…</p></main>
<script>
const $=i=>document.getElementById(i);
async function render(){const u=await Auth.user();if(!u){location.href='login.html?next=cuenta.html';return}
 const favs=await Auth.favoritos(),bus=await Auth.busquedas(),plus=u.plan==='plus';
 $('m').innerHTML=`<section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5 flex items-center gap-4"><div class="w-14 h-14 rounded-full bg-teal-600 text-white flex items-center justify-center text-2xl font-bold">${u.nombre[0].toUpperCase()}</div><div><h1 class="text-xl font-bold">${u.nombre}</h1><p class="text-sm opacity-70">${u.email}</p></div><span class="ml-auto text-sm rounded-full px-3 py-1 ${plus?'bg-violet-600 text-white':'bg-slate-200 dark:bg-slate-700'}">${plus?'⭐ Plus':'Gratis'}</span></section>
 <section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5"><h2 class="font-bold">Plan</h2><p class="text-sm mt-1">${plus?'Tienes GeoHogar Plus activo.':'Estás en el plan Gratis (hasta '+GH_CONFIG.limiteFavoritosGratis+' favoritos).'}</p>
  <div class="mt-3 flex gap-2">${plus?(Auth.demo?'<button id="down" class="border rounded-lg px-3 py-1.5 text-sm">Volver a Gratis (demo)</button>':''):'<a href="planes.html" class="bg-violet-600 text-white rounded-lg px-3 py-1.5 text-sm">Mejorar a Plus</a>'}</div></section>
 <section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5"><h2 class="font-bold">❤️ Favoritos (${favs.length}${plus?'':' / '+GH_CONFIG.limiteFavoritosGratis})</h2><p class="text-sm opacity-70 mt-1">${favs.length?favs.slice(0,30).join(', '):'Aún no tienes favoritos: toca el corazón en la ficha de una propiedad.'}</p></section>
 <section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5"><h2 class="font-bold">🔔 Búsquedas guardadas y alertas ${plus?'':'<span class="text-xs bg-violet-100 text-violet-700 rounded-full px-2">🔒 Plus</span>'}</h2>${bus.length?'<ul class="text-sm mt-2 list-disc ml-5">'+bus.map(b=>'<li>'+(b.nombre||'Búsqueda')+(b.alerta?' · alerta activa':'')+'</li>').join('')+'</ul>':'<p class="text-sm opacity-70 mt-1">Ninguna todavía.</p>'}</section>
 <section id="np" class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5 ${location.hash==='#nueva-clave'?'':'hidden'}"><h2 class="font-bold">Nueva contraseña</h2><input id="pw" type="password" minlength="6" class="mt-2 w-full px-3 py-2 rounded-lg border dark:bg-slate-700"><button id="pwB" class="mt-2 bg-teal-600 text-white rounded-lg px-3 py-1.5 text-sm">Guardar</button><p id="pwM" class="text-sm mt-1"></p></section>
 <button id="out" class="w-full border border-red-500 text-red-600 rounded-xl py-2.5 font-semibold">Cerrar sesión</button>`;
 $('out').onclick=async()=>{await Auth.signOut();location.href='index.html'};if($('down'))$('down').onclick=async()=>{await Auth.setDemoPlan('gratis');render()};
 $('pwB').onclick=async()=>{try{$('pwM').textContent=await Auth.updatePassword($('pw').value)}catch(e){$('pwM').textContent=e.message}}}
render();Auth.banner();
</script></body></html>
