<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d9488"><link rel="icon" type="image/png" href="icons/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Perfil del anunciante · MapMarket</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:"class"};if(localStorage.getItem('gh_dark')==='1')document.documentElement.classList.add('dark')</script>
<script src="js/config.js"></script><script src="js/guard.js"></script><script src="js/auth.js"></script><script src="js/i18n.js"></script><link rel="stylesheet" href="css/mm.css"></head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">
<header class="bg-white dark:bg-slate-800 shadow"><div class="max-w-4xl mx-auto flex items-center gap-3 px-4 py-2"><a href="index.html" class="font-bold text-teal-700 dark:text-teal-400 py-2">📍 MapMarket</a><span class="text-sm opacity-70">👤 Perfil del anunciante</span><a href="index.html" class="ml-auto text-sm py-3 px-2">🗺️ Mapa</a></div></header>
<main id="m" class="max-w-4xl mx-auto p-4"><p>Cargando…</p></main>
<script>
const $=i=>document.getElementById(i),X=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),T=s=>window.MMT?MMT(s):s;
(async()=>{const id=new URLSearchParams(location.search).get('id');const c=await Auth.client();
 if(!id||!/^[0-9a-f-]{36}$/i.test(id)){$('m').innerHTML='<p>'+T('Perfil no encontrado.')+'</p>';return}
 const {data:p}=await c.rpc('perfil_publico',{p_id:id});if(!p){$('m').innerHTML='<p>'+T('Perfil no encontrado.')+'</p>';return}
 const {data:L}=await c.from('anuncios').select('id,titulo,precio,moneda,provincia,zona,imagenes,tipo').eq('owner_id',id).eq('estado','aprobado').order('created_at',{ascending:false}).limit(60);
 const fmt=(v,m)=>(m==='CRC'?'₡':'$')+Math.round(v).toLocaleString(window.MMLocale||'es-CR');
 document.title=p.nombre+' · MapMarket';
 $('m').innerHTML=`<section class="bg-white dark:bg-slate-800 rounded-2xl shadow p-5 flex items-center gap-4">${p.foto_url?`<img src="${X(p.foto_url)}" alt="" class="w-20 h-20 rounded-full object-cover">`:`<div class="w-20 h-20 rounded-full bg-teal-600 text-white flex items-center justify-center text-3xl font-bold">${X(p.nombre[0]||'?').toUpperCase()}</div>`}
  <div><h1 class="text-2xl font-extrabold" data-noi18n>${X(p.nombre)}</h1><div class="flex flex-wrap gap-2 mt-1 text-xs">${p.verificado?`<span class="rounded-full bg-emerald-100 dark:bg-emerald-900 text-emerald-800 dark:text-emerald-200 px-2 py-0.5">✔ ${T('Correo verificado')}</span>`:''}${p.rol==='agente'?`<span class="rounded-full bg-violet-100 dark:bg-violet-900 px-2 py-0.5">🏢 ${T('Agente')}</span>`:''}<span class="opacity-70">${T('En MapMarket desde')} ${p.desde}</span></div>
  <div class="text-sm mt-1">${p.activos} ${p.activos==1?T('anuncio activo'):T('anuncios activos')}</div></div></section>
  <h2 class="text-lg font-bold mt-6">${T('Propiedades publicadas')}</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-3">${(L||[]).map(a=>`<a href="index.html?p=u-${a.id}" class="block rounded-2xl overflow-hidden bg-white dark:bg-slate-800 shadow hover:shadow-lg"><div class="h-44 bg-slate-200 dark:bg-slate-700">${a.imagenes&&a.imagenes[0]?`<img loading="lazy" decoding="async" src="${X(a.imagenes[0])}" alt="" class="w-full h-full object-cover">`:''}</div><div class="p-3"><div class="text-lg font-extrabold text-teal-700 dark:text-teal-300">${fmt(a.precio,a.moneda)}</div><div class="font-semibold" data-noi18n>${X(a.titulo)}</div><div class="text-xs opacity-70" data-noi18n>${X([a.zona,a.provincia].filter(Boolean).join(', '))}</div></div></a>`).join('')||`<p class="opacity-60">${T('Sin propiedades activas.')}</p>`}</div>`;
})();
</script></body></html>
