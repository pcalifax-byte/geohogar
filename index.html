<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script><script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
/* ===== Datos embebidos (generados al construir) ===== */
let EMBED={properties:[],provinces:null,medians:null,pois:[],builtAt:''};let FX={},TASAS={},MERCADO={},META={},REMATES={items:[]};
const CONFIG={USD_CRC:455,dataBase:'data/',whatsappSoporte:'' /* ej. '50688887777' */,chatApi:null /* ej. 'https://api.geohogar.cr/chat' (ver BACKEND.md) */,fxNote:'Tipo de cambio de referencia BCCR del 10 oct 2026 según dato aportado por el usuario (venta ₡455,60 · compra ₡449,86); se usa 455 fijo, aproximado. No verificado por MapMarket.',storageKey:'geohogar_mine',darkKey:'geohogar_dark',apiBase:null /* ej. 'https://api.geohogar.cr' o Supabase */};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=n=>Math.round(n).toLocaleString('es-CR');

/* ===== DataService: abstracción de la fuente de datos (embebida / localStorage / REST / Supabase) ===== */
const DataService={
 async getProperties({bbox,polygon}={}){ // con API: GET `${apiBase}/properties?bbox=...` o POST /properties/within
  if(CONFIG.apiBase){const r=await fetch(`${CONFIG.apiBase}/properties?bbox=${bbox||''}`);return r.json()}
  return EMBED.properties.concat(this.getLocal())},
 getLocal(){try{return JSON.parse(localStorage.getItem(CONFIG.storageKey)||'[]')}catch{return[]}},
 async addProperty(p){ // con API: POST `${apiBase}/properties`
  if(CONFIG.apiBase){return (await fetch(`${CONFIG.apiBase}/properties`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})).json()}
  const l=this.getLocal();l.push(p);localStorage.setItem(CONFIG.storageKey,JSON.stringify(l));return p},
 clearLocal(){localStorage.removeItem(CONFIG.storageKey)},
 getPOIs(){return EMBED.pois},
 toUSD(p){return p.price?(p.currency==='CRC'?p.price/CONFIG.USD_CRC:p.price):null},
 short(p){if(!p.price)return'A consultar';if(p.precio_flag==='dudoso')return'⚠️ '+this._short(p);return this._short(p)},
 _short(p){const s=p.currency==='CRC'?'₡':'$',v=p.price;return s+(v>=1e6?(+(v/1e6).toFixed(v>=1e7?0:1))+'M':v>=1e3?Math.round(v/1e3)+'K':v)},
 full(p){if(!p.price)return'Precio a consultar';const b=(p.precio_flag==='dudoso'?'⚠️ ':'')+(p.currency==='CRC'?'₡':'$')+fmt(p.price)+' '+p.currency;return p.currency==='CRC'?b+` (≈ $${fmt(this.toUSD(p))})`:b}
};

/* ===== MapController ===== */
const MapController={
 map:null,tiles:null,cluster:null,
 init(){
  const FILE=true; // CARTO pide API key: siempre OSMthis.osm=FILE;
  // CARTO exige Referer: al abrir como archivo local (file://) se usa OSM estándar (con filtro oscuro en modo dark).
  this.T=FILE?{light:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',dark:'https://tile.openstreetmap.org/{z}/{x}/{y}.png'}
   :{light:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',dark:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'};
  if(FILE)document.documentElement.classList.add('osm');
  this.map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([9.93,-84.1],9);
  L.control.zoom({position:'bottomleft'}).addTo(this.map);
  this.tiles=L.tileLayer(this.T.light,{attribution:'&copy; OpenStreetMap'+(FILE?'':' &copy; CARTO'),subdomains:'abcd',maxZoom:19}).addTo(this.map);
  this.cluster=L.markerClusterGroup({chunkedLoading:true,iconCreateFunction:c=>L.divIcon({html:`<div class="cl">${c.getChildCount()}</div>`,className:'',iconSize:[40,40]})}).addTo(this.map);
 },
 setTheme(dark){this.tiles.setUrl(dark?this.T.dark:this.T.light)},
 render(list){this.cluster.clearLayers();this.cluster.addLayers(list.map(p=>{
  const cls=(p.status&&p.status!=='activa')?'off':p.mine?'mine':p.demo?'demo':p.coord!=='exacta'?'ap':'';
  const m=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<span class="pb ${cls}">${DataService.short(p)}</span>`,iconSize:[0,0]})});
  m.on('click',()=>UI.showCard(p));return m}))}
};

/* ===== Filters ===== */
const Filters={
 state:{q:'',type:'',prov:'',beds:0,amen:[],est:'activa',src:'all',max:Infinity,exact:false,polygon:null},
 sliderToUSD(v){return v>=100?Infinity:Math.round(Math.pow(v/100,2.5)*1500000/1000)*1000},
 norm:s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),
 inPolygon([y,x],poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [yi,xi]=poly[i],[yj,xj]=poly[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins},
 apply(list){const s=this.state,q=this.norm(s.q);
  return list.filter(p=>p.lat!=null&&(!s.type||p.type===s.type)&&(!s.prov||p.province===s.prov)&&(!s.exact||p.coord!=='aproximada')
   &&(s.src==='all'||(s.src==='demo'?p.demo:s.src==='real'?!p.demo:p.source===s.src))&&(!s.beds||(p.beds||0)>=s.beds)&&(!s.amen.length||s.amen.every(a=>(p.amenidades||[]).includes(a)))&&(!s.est||(s.est==='activa'?(p.status||'activa')==='activa':(p.status||'activa')!=='activa'))
   &&(s.max===Infinity||((DataService.toUSD(p)??Infinity)<=s.max))&&(!q||this.norm(p.title+' '+p.location+' '+p.province).includes(q))
   &&(!s.polygon||this.inPolygon([p.lat,p.lon],s.polygon)))},
 bind(onChange){
  const set=(id,k,f=v=>v)=>$(id).addEventListener('input',e=>{this.state[k]=f(e.target.value);onChange()});
  set('q','q');set('fType','type');set('fProv','prov');set('fBeds','beds',Number);set('fEst','est');set('fSrc','src');
  set('fPrice','max',v=>this.sliderToUSD(+v))}
};

/* ===== Layers: capas informativas + dibujo de zona ===== */
const Layers={
 groups:{},heat:null,
 init(map){
  // Plusvalía: DATOS ILUSTRATIVOS (ejemplo), no estudio de mercado.
  // Coropleta: mediana de precio pedido de casas por provincia (Anuntico, informe en páginas de provincia, oct 2026)
  const M=EMBED.medians,vals=Object.values(M.prov).filter(v=>v.value),mx=Math.max(...vals.map(v=>v.value)),mn=Math.min(...vals.map(v=>v.value));
  const col=v=>{if(!v)return'#9ca3af';const t=(v-mn)/(mx-mn);return['#fef3c7','#fcd34d','#f59e0b','#ea580c','#b91c1c'][Math.min(4,Math.floor(t*5))]};
  const cho=L.geoJSON(EMBED.provinces,{style:f=>{const v=(M.prov[f.properties.name]||{}).value;return{color:'#7c2d12',weight:1,fillColor:col(v),fillOpacity:.45}},
   onEachFeature:(f,l)=>{const r=M.prov[f.properties.name]||{};l.bindTooltip(`<b>${f.properties.name}</b><br>Mediana casas: ${r.value?'₡'+(r.value/1e6).toLocaleString('es-CR')+'M':'sin dato'}${r.user?`<br><span style="font-size:10px">Dato aportado: ₡${r.user/1e6}M</span>`:''}<br><span style="font-size:10px">${esc(r.status||'')}</span>`,{sticky:true})}});
  const hot=[['Santa Ana – Escazú',[[9.94,-84.20],[9.95,-84.12],[9.91,-84.11],[9.89,-84.18],[9.90,-84.22]]],['Norte de Heredia (zonas francas)',[[10.04,-84.20],[10.03,-84.08],[9.98,-84.08],[9.97,-84.19]]],

   this.chips(['Limpiar filtros','Comparar bancos','Hablar con un agente']);return}
  if(best&&bs>=1){this.bot(esc(best.answer));
   const act={hipoteca:['Abrir calculadora',()=>UI.calculator(UI.cur)],gastos:['Ver desglose en la calculadora',()=>UI.calculator(UI.cur)],documentos:['Abrir guía de compra',()=>UI.guide(UI.cur)],cierre:['Ver proceso de cierre',()=>{UI.guide(UI.cur);document.querySelector('[data-tab="ci"]').click()}],dibujar:['Empezar a dibujar',()=>{$('chatW').classList.add('hidden');Layers.startDraw()}],publicar:['Publicar propiedad',()=>$('bPub').click()]}[best.id];
   if(act){const b=document.createElement('button');b.className='text-xs bg-teal-600 text-white rounded-full px-3 py-1';b.textContent=act[0];b.onclick=act[1];$('chatLog').appendChild(b)}
   return}
  this.bot(esc(this.kb.fallback));this.chips(this.kb.chips)}
};
async function loadData(){const g=n=>fetch(CONFIG.dataBase+n+'?v='+Date.now().toString().slice(0,-5)).then(r=>{if(!r.ok)throw new Error(n);return r.json()});
 const [props,capas,fx,tasas,mercado,meta]=await Promise.all(['propiedades.json','capas.json','tipo_cambio.json','tasas.json','mercado.json','meta.json'].map(g));REMATES={items:[],fuentes:{}};window.loadRemates=()=>window._remP||(window._remP=g('remates.json').then(r=>{Object.assign(REMATES,r);if(Remates.on.remate||Remates.on.adjudicado)Remates.render(MapController.map)}).catch(()=>{window._remP=null}));(window.requestIdleCallback||setTimeout)(()=>loadRemates(),3000)
 EMBED={properties:props,provinces:capas.provinces,medians:capas.medians,pois:capas.pois,builtAt:new Date(meta.last_updated).toLocaleDateString('es-CR',{day:'numeric',month:'short',year:'numeric'})};
 FX=fx;TASAS=tasas;MERCADO=mercado;META=meta;CONFIG.USD_CRC=fx.referencia||fx.venta||455;
 $('fxLbl').textContent=`₡→$ 1 USD ≈ ${CONFIG.USD_CRC} CRC (BCCR compra ${fx.compra} / venta ${fx.venta}, ${fx.fecha})`;
 $('upd').textContent='Actualizado: '+new Date(meta.last_updated).toLocaleString('es-CR',{dateStyle:'medium',timeStyle:'short'})}
window.addEventListener('DOMContentLoaded',async()=>{try{await loadData()}catch(e){alert('No se pudieron cargar los datos: '+e.message);return}App.init();Chat.init();Plus.init().then(()=>Feat.init())});
